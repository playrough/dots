[config]
version_check = false

[templates.kitty]
input_path = '~/.config/noctalia/templates/kitty.conf'
output_path = '~/.config/kitty/themes/noctalia.conf'
post_hook = 'kitty +kitten themes --reload-in=all noctalia'

[templates.ghostty]
input_path = '~/.config/noctalia/templates/ghostty'
output_path = '~/.config/ghostty/themes/Matugen'
post_hook = 'pkill -SIGUSR2 ghostty'

[templates.hyprland]
input_path = '~/.config/noctalia/templates/hyprland.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.rofi]
input_path = '~/.config/noctalia/templates/rofi.rasi'
output_path = '~/.config/rofi/noctalia/matugen-rofi.rasi'

[templates.btop]
input_path = '~/.config/noctalia/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.qt5ct]
input_path = '~/.config/noctalia/templates/qtct.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/noctalia/templates/qtct.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.gtk3]
input_path = '~/.config/noctalia/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3'

[templates.gtk4]
input_path = '~/.config/noctalia/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
post_hook = '~/.config/noctalia/post-hook-scripts/gtk-themes-reload.sh'

[templates.zathura]
input_path = '~/.config/noctalia/templates/zathurarc'
output_path = '~/.config/zathura/matugen-zathurarc'

[templates.pywalfox]
input_path = '~/.config/noctalia/templates/pywalfox.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.yazi]
input_path = '~/.config/noctalia/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.yazi-feh]
input_path = '~/.config/noctalia/templates/yazi.toml'
output_path = '~/.config/yazi/yazi.toml'

[templates.nvim]
input_path = '~/.config/noctalia/templates/nvim.json'
output_path = '~/.config/nvim/colors.json'
post_hook = 'pkill -SIGUSR1 nvim || true'

[templates.web]
input_path = '~/.config/noctalia/templates/web.css'
output_path = '~/.config/web/colors.css'

[templates.tridactyl]
input_path = '~/.config/noctalia/templates/tridactyl.css'
output_path = '~/.config/tridactyl/themes/colors.css'

[templates.cava]
input_path = '~/.config/noctalia/templates/cava'
output_path = '~/.config/cava/config'

[templates.librewolf]
input_path = "~/.config/noctalia/templates/librewolf.css"
output_path = "~/.config/librewolf/chrome/colors.css"

[templates.zen-chrome]
input_path = "~/.config/noctalia/templates/zen/zen-userChrome.css"
output_path = "~/.cache/noctalia/zen-browser/zen-userChrome.css"

[templates.zen-content]
input_path = "~/.config/noctalia/templates/zen/zen-userContent.css"
output_path = "~/.cache/noctalia/zen-browser/zen-userContent.css"
